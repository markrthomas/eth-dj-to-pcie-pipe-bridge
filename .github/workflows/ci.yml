# CI for eth-dj-pcie-pipe7_1-bridge — per ~/proj/DV_STANDARDS.md.
# regress (lint + Icarus directed + shared scenarios) is the fast gate; coverage
# (Verilator, >= 80% line+branch) and the four other DV environments run after it,
# and `crosscheck` requires all five environments to agree with the golden model
# (dv/common/scenarios.py).  formal runs SymbiYosys prove + cover (formal/*.sby).
# dv/sva assertions are bound in the Verilator envs (coverage, systemc, uvm).
# OSS CAD Suite pinned to match ~/proj/dv_env.mk; cocotb==1.8.1.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OSS_CAD_SUITE_VERSION: "2026-04-13"

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite (Verilator + Icarus)
        run: |
          set -euo pipefail
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE_VERSION//-/}.tgz"
          curl -fsSL "$url" -o oss-cad-suite.tgz
          tar -xzf oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: regress (lint + sim)
        run: make regress
      - name: power-aware TB, functional only (PMU sequencing; UPF itself is not run)
        run: make upf-tb
      - name: GTKWave sessions vs fresh dumps (static check; no GUI in CI)
        run: make wave-check-all
      - name: dashboard renders from the committed metrics.db
        run: make dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-iverilog
          path: dv/iverilog/sim_build/*.json

  coverage:
    runs-on: ubuntu-latest
    needs: regress
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite
        run: |
          set -euo pipefail
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE_VERSION//-/}.tgz"
          curl -fsSL "$url" -o oss-cad-suite.tgz
          tar -xzf oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: coverage (Verilator C++ env, floor 80%)
        run: make coverage
      - name: upload coverage + vlt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.info
            dv/vlt/logs/results.json
            dv/vlt/logs/coverage_summary.json

  systemc:
    runs-on: ubuntu-latest
    needs: regress
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite
        run: |
          set -euo pipefail
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE_VERSION//-/}.tgz"
          curl -fsSL "$url" -o oss-cad-suite.tgz
          tar -xzf oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: Install SystemC
        run: sudo apt-get update && sudo apt-get install -y libsystemc-dev
      - name: systemc env
        run: make systemc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-systemc
          path: dv/systemc/logs/results.json

  uvm:
    runs-on: ubuntu-latest
    needs: regress
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite (Verilator 5.047, UVM-capable)
        run: |
          set -euo pipefail
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE_VERSION//-/}.tgz"
          curl -fsSL "$url" -o oss-cad-suite.tgz
          tar -xzf oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: uvm env (Accellera uvm-core on Verilator --timing)
        run: make uvm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-uvm
          path: dv/uvm/logs/results.json

  cocotb:
    runs-on: ubuntu-latest
    needs: regress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Icarus (apt) + cocotb/pyuvm/pyvsc
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python -m pip install -r dv/cocotb/requirements.txt
      - name: cocotb env (ICARUS_BIN_DIR=/usr/bin)
        run: make cocotb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-cocotb
          path: |
            dv/cocotb/results.json
            dv/cocotb/fcov.json
            dv/cocotb/results.xml

  crosscheck:
    runs-on: ubuntu-latest
    needs: [regress, coverage, systemc, uvm, cocotb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: all five DV environments agree with the golden model
        run: |
          python3 dv/common/crosscheck.py --require iverilog,vlt,uvm,systemc,cocotb \
            $(find artifacts -name results.json)

  formal:
    runs-on: ubuntu-latest
    needs: regress
    steps:
      - uses: actions/checkout@v4
      - name: Install OSS CAD Suite (sby, yosys + slang, abc, yices)
        run: |
          set -euo pipefail
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_SUITE_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_SUITE_VERSION//-/}.tgz"
          curl -fsSL "$url" -o oss-cad-suite.tgz
          tar -xzf oss-cad-suite.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: formal (prove + cover)
        run: make formal
