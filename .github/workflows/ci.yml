# CI for eth-dj-pcie-pipe7_1-bridge — per ~/proj/DV_STANDARDS.md.
# NO OSS CAD Suite: a `build-image` job builds the pinned toolchain (Verilator +
# Yosys/slang + SBY from source, Icarus/SystemC/z3 from apt, cocotb from pip) into
# a GHCR image (the Dockerfile `tools` target), cached by tool versions, and the
# DV jobs run inside it via `container:`.
#
# regress (lint + Icarus directed + shared scenarios) is the fast gate; coverage
# (Verilator, >= 80% line+branch) and the four other DV environments run after it;
# `crosscheck` requires all five environments to agree with the golden model
# (dv/common/scenarios.py). formal runs SymbiYosys prove + cover (formal/*.sby).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Build (or reuse) the toolchain image. Tag = hash of Dockerfile + the pip
  # requirements, so it is rebuilt only when the toolchain definition changes.
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          tag="tools-$(cat Dockerfile dv/cocotb/requirements.txt | sha256sum | cut -c1-12)"
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}/dv-tools:${tag}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push the toolchain image if it is not already cached
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "reusing cached toolchain image: $img"
          else
            echo "building toolchain image: $img"
            docker build --target tools -t "$img" .
            docker push "$img"
          fi

  regress:
    needs: build-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: regress (lint + sim)
        run: make regress
      - name: power-aware TB, functional only (PMU sequencing; UPF itself is not run)
        run: make upf-tb
      - name: x4-lane elaboration + full iverilog suite (PIPE_NLANES_OVERRIDE=4)
        run: make lanes4
      - name: GTKWave sessions vs fresh dumps (static check; no GUI in CI)
        run: make wave-check-all
      - name: dashboard renders from the committed metrics.db
        run: make dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-iverilog
          path: dv/iverilog/sim_build/*.json

  coverage:
    needs: [build-image, regress]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: coverage (Verilator C++ env, floor 80%)
        run: make coverage
      - name: vlt env, link flow control ON (D16)
        run: make vlt-fc
      - name: Verilator C++ env + SVA, datapath-local reset DISABLED (D18, pre-D18 behaviour)
        run: make vlt-nodpr
      - name: upload coverage + vlt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.info
            dv/vlt/logs/results.json
            dv/vlt/logs/coverage_summary.json

  systemc:
    needs: [build-image, regress]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: systemc env
        run: make systemc
      - name: systemc env, link flow control ON (D16)
        run: make systemc-fc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-systemc
          path: dv/systemc/logs/results.json

  uvm:
    needs: [build-image, regress]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: uvm env (Accellera uvm-core on Verilator --timing)
        run: make uvm
      - name: uvm env, link flow control ON (D16)
        run: make uvm-fc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-uvm
          path: dv/uvm/logs/results.json

  cocotb:
    needs: [build-image, regress]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: cocotb env
        run: make cocotb
      - name: cocotb env, link flow control ON (D16)
        run: make cocotb-fc
      - name: PD_DP power-state emulation, datapath-local reset ON (default; retain nothing must pass, D18)
        run: make pd-emu
      - name: PD_DP power-state emulation, reset DISABLED (retention matrix + negative control)
        run: make pd-emu-ret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-cocotb
          path: |
            dv/cocotb/results.json
            dv/cocotb/fcov.json
            dv/cocotb/results.xml

  formal:
    needs: [build-image, regress]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: formal (prove + cover)
        run: make formal

  crosscheck:
    needs: [regress, coverage, systemc, uvm, cocotb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: all five DV environments agree with the golden model
        run: |
          python3 dv/common/crosscheck.py --require iverilog,vlt,uvm,systemc,cocotb \
            $(find artifacts -name results.json)
