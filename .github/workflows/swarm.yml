# Manual-only: run the Claude Code agent swarm (docker/swarm.sh) in the CI image.
# Needs a repository secret CLAUDE_CODE_OAUTH_TOKEN (preferred, same variable as the Railway
# service) or ANTHROPIC_API_KEY.  The swarm may push a feature branch
# and open a DRAFT PR with GITHUB_TOKEN; a human reviews and merges.
name: swarm

on:
  workflow_dispatch:
    inputs:
      task:
        description: "task file (repo-relative)"
        default: "docker/swarm-task.md"
      model:
        description: "model for the swarm-manager (empty = CLI default)"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: require a credential
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$OAUTH$KEY" || { echo "::error::set the CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) repository secret"; exit 1; }
      - name: build image (with Claude Code CLI)
        run: docker build --build-arg WITH_CLAUDE=1 -t bridge-swarm .
      - name: run swarm
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY -e GITHUB_TOKEN -v "$PWD:/repo" bridge-swarm \
            swarm --task "${{ inputs.task }}" ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-metrics
          path: docker/last-run-metrics.json
